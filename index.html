<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABINET · 珍奇柜 · 空间制图与测绘藏录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="data/themes.js"></script>
  <script src="data/manifest.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/theme.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="vendor/openseadragon.min.js"></script>
  <script src="vendor/morph-bundle.js?v=20261002_v1"></script>
</head>
<body data-page="gallery">
  <!-- Fixed Top Header & Subbar Wrapper (整体粘性固定于视口顶部) -->
  <div class="app-header-sticky">
    <!-- Top Navigation Header -->
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-badge"></div>
          <div class="brand-text">
            <h1 class="brand-title" data-i18n="cabinetBrandTitle">CABINET</h1>
          </div>
        </div>

        <div class="header-meta">
          <!-- External link to Personal Gallery -->
          <a href="https://github.com/OpenQGIS/gallery" target="_blank" rel="noopener noreferrer" class="nav-switch-link" title="访问创作者原创个人画廊 (Gallery)" data-i18n-title="navGalleryTitle">
            <span data-i18n="navAuthorGallery">创作者个人画廊 (Gallery)</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
          </a>
          <div class="divider"></div>
          <button class="icon-btn theme-toggle-btn" id="btnToggleTheme" title="切换暗色 / 浅色模式" aria-label="切换主题" data-i18n-title="navThemeToggle">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="icon-btn lang-toggle-btn" id="btnHeaderLang" title="切换语言 / Switch Language" aria-label="切换语言" data-i18n-title="navLangTitle">
            <span class="lang-code-text" id="headerLangText">EN</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Subbar: Sticky Sub Tag Filter & Dimension Filter -->
    <nav class="gallery-subbar" aria-label="分类筛选">
      <div class="subbar-inner">
        <div class="filter-group" id="filterGroup">
          <span class="filter-label" data-i18n="filterTopicLabel">分类专题:</span>
          <button class="filter-chip active" data-filter="all"><span data-i18n="filterAllLabel">全部</span> (<span id="countAll">8</span>)</button>
          <!-- Dynamic Subcategory Tags injected by app.js -->
          <span class="filter-divider"></span>
          <button class="filter-chip" data-filter="wide" data-i18n="filterWide">横版</button>
          <button class="filter-chip" data-filter="tall" data-i18n="filterTall">竖版</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Main Waterfall Gallery Grid -->
  <main class="gallery-main" id="mainContainer">
    <div class="masonry-grid" id="galleryGrid">
      <!-- Dynamically populated by app.js -->
    </div>
  </main>

  <!-- Fullscreen Deep Zoom Viewer Modal (原生 OpenSeadragon 视口) -->
  <div class="viewer-modal" id="viewerModal" aria-hidden="true" role="dialog" aria-label="Deep Zoom 展品阅览">
    <div class="viewer-backdrop" id="viewerBackdrop"></div>
    <div class="viewer-container">
      <!-- Top-Left Floating Artwork Title Badge · 地图左上角展品名称浮标 -->
      <div class="viewer-artwork-badge" id="viewerArtworkBadge">
        <span class="viewer-artwork-title" id="viewerTitle">作品名称</span>
      </div>

      <!-- Left & Right Edge Navigation Paddles (左右视口边缘切换) -->
      <button class="viewer-edge-nav edge-prev" id="btnEdgePrev" title="上一幅 (←)" aria-label="上一幅">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="viewer-edge-nav edge-next" id="btnEdgeNext" title="下一幅 (→)" aria-label="下一幅">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <div class="viewer-body">
        <div class="osd-stage" id="osdStage">
          <!-- OpenSeadragon Canvas injects here -->
        </div>

        <!-- 鹰眼图展开状态容器 (左下角吸附，纯净无常驻冗余文字，全靠悬停弹窗) -->
        <div class="navigator-wrapper is-collapsed" id="navWrapper">
          <!-- 鼠标悬停时浮现的提示弹窗 -->
          <div class="nav-hover-tooltip" id="navHoverTooltip">
            <div class="nav-tip-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
              <span data-i18n="navOverviewTitle">鹰眼图</span>
              <kbd class="kbd-badge">O</kbd>
            </div>
            <div class="nav-tip-divider"></div>
            <div class="nav-tip-action" data-i18n="navTipDragZoom">
              按住 <strong>拖拽画框</strong> 缩放 · <strong>单击</strong> 平移
            </div>
          </div>

          <div class="navigator-stage" id="navStageContainer">
            <!-- 悬停右上角轻量关闭按钮 -->
            <button class="nav-floating-close" id="btnCloseNav" title="收起鹰眼图 (快捷键: O)" aria-label="收起鹰眼图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <!-- OpenSeadragon 鹰眼挂载点 -->
            <div id="osdNavigator"></div>
            <!-- 鼠标画框交互透明蒙层 -->
            <div class="nav-draw-overlay" id="navDrawOverlay">
              <!-- 临时虚线反色绘制框 -->
              <div class="nav-draw-box" id="navDrawBox"></div>
            </div>
          </div>
        </div>

        <!-- 关闭鹰眼图后的液态玻璃胶囊唤起浮标 -->
        <div class="nav-launcher-wrapper" id="navLauncher">
          <div class="launcher-tooltip" id="launcherTooltip">
            <span data-i18n="navTipKeyOpenPrefix">按</span>
            <kbd class="kbd-badge">O</kbd>
            <span data-i18n="navTipKeyOpenSuffix">键再次打开鹰眼图</span>
          </div>
          <button class="nav-launcher-btn" id="btnOpenNav" title="点击或按 O 键打开鹰眼图" aria-label="打开鹰眼图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
            <span data-i18n="navOverviewTitle">鹰眼图</span>
            <kbd class="kbd-badge">O</kbd>
          </button>
        </div>

        <!-- Floating Viewer Toolbar -->
        <div class="viewer-floating-toolbar">
          <div class="tool-zoom-badge" id="toolZoomBadge" title="当前视野相对原始物理像素缩放比">100%</div>
          <button class="tool-btn tool-btn-text" id="toolActualSize" title="1:1 原始物理像素点对点显示 (快捷键 1)">1:1</button>
          <div class="tool-divider"></div>
          <button class="tool-btn" id="toolReset" aria-label="全图展开全貌" data-i18n-title="toolFitScreen">
            <span class="tb-icon-layer">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path id="pathResetMorph" d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M8 8h8v8H8z"/>
              </svg>
            </span>
          </button>
          <button class="tool-btn" id="toolRotate" aria-label="顺时针旋转" data-i18n-title="actionRotate" data-custom-tip="顺时针旋转 (R)">
            <span class="tb-icon-layer">
              <svg id="toolRotateSvg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path id="pathRotateMorph" d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/>
              </svg>
            </span>
          </button>
          <button class="tool-btn" id="toolFullscreen" aria-label="视口全屏" data-i18n-title="actionFullscreen" data-custom-tip="视口全屏 (F)">
            <span class="tb-icon-layer">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path id="pathFullscreenMorph" d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
              </svg>
            </span>
          </button>
          <div class="tool-divider"></div>
          <button class="tool-btn info-btn" id="btnToggleInfo" aria-label="作品详情" data-i18n-title="actionToggleInfo">
            <span class="tb-icon-layer">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path id="pathInfoMorph" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 16v-4M12 8h.01"/>
              </svg>
            </span>
          </button>
          <button class="tool-btn" id="toolToggleLang" title="切换语言 / Switch Language" aria-label="切换语言">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </button>
          <button class="tool-btn theme-toggle-btn" id="toolToggleTheme" title="切换主题模式" aria-label="切换主题模式">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div class="tool-divider"></div>
          <button class="tool-btn" id="btnCloseViewer" title="退出阅览 (Esc)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <aside class="viewer-drawer" id="viewerDrawer">
        <div class="drawer-header">
          <h3 data-i18n="metaDrawerTitle">展品档案与详情</h3>
          <button class="drawer-close-btn" id="btnDrawerClose" title="关闭面板" data-i18n-title="actionClose">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="drawer-content">
          <div class="meta-item">
            <label data-i18n="metaArtworkTitle">作品名称</label>
            <div class="value strong" id="metaTitle">-</div>
          </div>
          <div class="meta-item">
            <label data-i18n="metaCategory">分类归属</label>
            <div class="value" id="metaCategory">-</div>
          </div>
          <div class="meta-item" id="metaAuthorBox">
            <label data-i18n="metaAuthor">作者 / 出处</label>
            <div class="value highlight" id="metaAuthor">-</div>
          </div>
          <div class="meta-item" id="metaDateBox">
            <label data-i18n="metaDate">创作日期</label>
            <div class="value font-mono" id="metaDate">-</div>
          </div>
          <div class="meta-item" id="metaColorPaletteBox">
            <label data-i18n="metaPaletteTitle">主色板 · 提取色系 (点击复制 HEX)</label>
            <div class="meta-swatches" id="metaColorSwatches">
              <!-- Dynamically populated by app.js -->
            </div>
          </div>
          <div class="meta-item" id="metaDescBox">
            <label data-i18n="metaNotesTitle">作品说明</label>
            <div class="value meta-desc-text" id="metaDescription">-</div>
          </div>
          <div class="meta-item">
            <label data-i18n="metaSourceFile">源文件</label>
            <div class="value font-mono" id="metaFilename">-</div>
          </div>
          <div class="meta-item">
            <label data-i18n="metaResolution">原始分辨率</label>
            <div class="value font-mono" id="metaResolution">-</div>
          </div>
          <div class="meta-item">
            <label data-i18n="metaRatio">构图纵横比</label>
            <div class="value" id="metaAspect">-</div>
          </div>
          <div class="meta-item">
            <label data-i18n="metaPyramidLevels">超高清层级</label>
            <div class="value font-mono" id="metaLevels">-</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
